version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      k8s:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      otel:
        patterns: ["go.opentelemetry.io/*"]
      prometheus:
        patterns: ["github.com/prometheus/*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["actions/*"]
      docker:
        patterns: ["docker/*"]
