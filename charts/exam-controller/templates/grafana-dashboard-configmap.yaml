{{- if .Values.grafana.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "exam-controller.fullname" . }}-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "exam-controller.labels" . | nindent 4 }}
    {{ .Values.grafana.dashboard.label }}: {{ .Values.grafana.dashboard.labelValue | quote }}
  {{- if .Values.grafana.dashboard.folder }}
  annotations:
    grafana-folder: {{ .Values.grafana.dashboard.folder | quote }}
  {{- end }}
data:
  exam-overview.json: |-
    {{- .Files.Get "dashboards/exam-overview.json" | nindent 4 }}
{{- end }}
