{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "exam-controller.fullname" . }}-allow-metrics-traffic
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "exam-controller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "exam-controller.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          {{- toYaml .Values.networkPolicy.metricsNamespaceSelector | nindent 10 }}
    ports:
    - port: {{ .Values.metrics.port }}
      protocol: TCP
  {{- if .Values.webhook.enabled }}
  - from:
    - namespaceSelector: {}
    ports:
    - port: 9443
      protocol: TCP
  {{- end }}
{{- end }}
