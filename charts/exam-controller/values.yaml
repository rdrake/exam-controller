replicaCount: 1

image:
  repository: ghcr.io/rdrake/exam-controller
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

leaderElection:
  enabled: true

metrics:
  enabled: true
  port: 8443
  secure: true
  serviceMonitor:
    enabled: false
    interval: "30s"

webhook:
  enabled: false
  certDir: ""
  certName: tls.crt
  keyName: tls.key

healthProbe:
  port: 8081

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: false
  metricsNamespaceSelector:
    metrics: enabled
