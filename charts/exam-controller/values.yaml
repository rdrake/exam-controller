replicaCount: 1

image:
  repository: ghcr.io/rdrake/exam-controller
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

leaderElection:
  enabled: true

metrics:
  enabled: true
  port: 8443
  secure: true
  serviceMonitor:
    enabled: false
    interval: "30s"

webhook:
  enabled: false
  certDir: ""
  certName: tls.crt
  keyName: tls.key

platform:
  baseDomain: science.ontariotechu.ca
  ingressTLSSecretName: ""  # empty disables TLS secret management (cert-manager/service mesh handles TLS)
  smtpSecretName: exam-smtp-credentials
  secretNamespace: ""

healthProbe:
  port: 8081

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  metricsNamespaceSelector:
    metrics: enabled

grafana:
  dashboard:
    enabled: false
    label: grafana_dashboard
    labelValue: "1"
    folder: ""
