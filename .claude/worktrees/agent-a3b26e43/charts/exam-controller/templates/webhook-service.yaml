{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "exam-controller.fullname" . }}-webhook-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "exam-controller.labels" . | nindent 4 }}
spec:
  ports:
  - port: 443
    targetPort: 9443
    protocol: TCP
  selector:
    {{- include "exam-controller.selectorLabels" . | nindent 4 }}
{{- end }}
